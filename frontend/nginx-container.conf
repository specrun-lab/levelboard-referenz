# Levelboard – nginx im Frontend-Container (Level 7).
# Gleiche Regeln wie nginx-api.conf; Unterschiede: Pfade im Image, Logs nach stdout/stderr,
# Port 8080 auf allen Schnittstellen des Containers, /api/ → Backend-Container „backend:8081“.
# Alle relativen Pfade beziehen sich auf das Präfix (-p), also den Projektordner.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  # Eigene MIME-Typen statt einer externen mime.types (Pfad ist je System verschieden)
  types {
    text/html               html;
    text/css                css;
    application/javascript  js mjs;
    application/json        json;
    image/svg+xml           svg;
    image/png               png;
    image/x-icon            ico;
    font/woff2              woff2;
  }
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css application/javascript application/json;

  server_tokens off;
  access_log /dev/stdout;

  client_body_temp_path /tmp/client;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Ergebnisse und Einstellung: immer frisch
    location = /results.json {
      add_header Cache-Control "no-store" always;
    }
    location = /config.json {
      add_header Cache-Control "no-store" always;
    }

    # Einstiegsseite: immer neu prüfen
    location = /index.html {
      add_header Cache-Control "no-cache" always;
    }

    # Gebaute Dateien mit Hash im Namen: ein Jahr, unveränderlich
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # REST-API: unverändert an das Backend weiterreichen (Status, JSON, Header)
    location /api/ {
      proxy_pass http://backend:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      # Antworten des Backends unverändert lassen: kein „; charset=utf-8“ an application/json anhängen
      charset off;
      add_header Cache-Control "no-store" always;
    }

    # Alles andere: nur vorhandene Dateien, sonst echter 404 (kein Fallback auf index.html)
    location / {
      try_files $uri $uri/ =404;
    }
  }
}
