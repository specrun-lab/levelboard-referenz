# Levelboard – nginx ohne root-Rechte.
# Start (aus dem Projektordner): nginx -p "$PWD/" -e .run/nginx-error.log -c frontend/nginx.conf
# Alle relativen Pfade beziehen sich auf das Präfix (-p), also den Projektordner.

worker_processes 1;
pid .run/nginx.pid;
error_log .run/nginx-error.log warn;

events {
  worker_connections 256;
}

http {
  # Eigene MIME-Typen statt einer externen mime.types (Pfad ist je System verschieden)
  types {
    text/html               html;
    text/css                css;
    application/javascript  js mjs;
    application/json        json;
    image/svg+xml           svg;
    image/png               png;
    image/x-icon            ico;
    font/woff2              woff2;
  }
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css application/javascript application/json;

  server_tokens off;
  access_log .run/nginx-access.log;

  client_body_temp_path .run/nginx-tmp/client;
  proxy_temp_path       .run/nginx-tmp/proxy;
  fastcgi_temp_path     .run/nginx-tmp/fastcgi;
  uwsgi_temp_path       .run/nginx-tmp/uwsgi;
  scgi_temp_path        .run/nginx-tmp/scgi;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json;

  server {
    listen 127.0.0.1:8080;
    root frontend/dist;
    index index.html;

    # Ergebnisse und Einstellung: immer frisch
    location = /results.json {
      add_header Cache-Control "no-store" always;
    }
    location = /config.json {
      add_header Cache-Control "no-store" always;
    }

    # Einstiegsseite: immer neu prüfen
    location = /index.html {
      add_header Cache-Control "no-cache" always;
    }

    # Gebaute Dateien mit Hash im Namen: ein Jahr, unveränderlich
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Alles andere: nur vorhandene Dateien, sonst echter 404 (kein Fallback auf index.html)
    location / {
      try_files $uri $uri/ =404;
    }
  }
}
