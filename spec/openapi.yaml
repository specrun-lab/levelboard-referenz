openapi: 3.1.0
info:
  title: Levelboard-API
  version: 0.4.0
  description: |
    REST-Schnittstelle des Levelboard-Backends (ab Level 3).
    Regeln und Beispiele stehen in 04-api.md. Bei Widersprüchen gilt diese Datei.
servers:
  - url: http://127.0.0.1:8081
paths:
  /api/health:
    get:
      summary: Lebenszeichen
      responses:
        '200':
          description: Dienst läuft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /api/levels:
    get:
      summary: Alle Levels und Laufdaten (Format von results.json)
      responses:
        '200':
          description: Gesamtstand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Results' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /api/levels/{n}:
    parameters:
      - $ref: '#/components/parameters/LevelNumber'
    get:
      summary: Ein einzelnes Level
      responses:
        '200':
          description: Das Level
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Level' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /api/levels/{n}/result:
    parameters:
      - $ref: '#/components/parameters/LevelNumber'
    post:
      summary: Prüfergebnis für ein Level melden
      description: |
        Der Server setzt die Regeln durch (siehe 04-api.md):
        Status aus den Checks, checkedAt und run.updatedAt vom Server,
        höhere Levels offen bzw. gesperrt. Ist ein niedrigeres Level nicht
        bestanden, antwortet er mit 409 und ändert nichts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResultReport' }
      responses:
        '200':
          description: Neuer Gesamtstand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Results' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /api/levels/{n}/history:
    parameters:
      - $ref: '#/components/parameters/LevelNumber'
    get:
      summary: Historie der angenommenen Meldungen zu Level n (ab Level 4), neueste zuerst
      parameters:
        - name: limit
          in: query
          required: false
          description: 1–500, Standard 50 (sonst 400)
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: Historie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/History' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
components:
  parameters:
    LevelNumber:
      name: n
      in: path
      required: true
      description: Levelnummer 1–10 (sonst 404)
      schema: { type: integer, minimum: 1, maximum: 10 }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version, commit]
      properties:
        status: { const: ok }
        version: { type: string, minLength: 1 }
        commit: { type: [string, 'null'], description: 'Wert von LEVELBOARD_COMMIT (ab Spec 0.8.0), sonst null' }
    Check:
      type: object
      additionalProperties: false
      required: [name, ok]
      properties:
        name: { type: string, minLength: 1 }
        ok: { type: boolean }
    Level:
      type: object
      additionalProperties: false
      required: [level, title, status, checkedAt, durationMs, checks, metrics]
      properties:
        level: { type: integer, minimum: 1, maximum: 10 }
        title: { type: string }
        status: { enum: [offen, bestanden, fehlgeschlagen, gesperrt] }
        checkedAt: { type: [string, 'null'], format: date-time }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        checks:
          type: array
          items: { $ref: '#/components/schemas/Check' }
        metrics: { type: object }
    Results:
      description: Identisch mit results.schema.json
      type: object
      additionalProperties: false
      required: [run, levels]
      properties:
        run:
          type: object
          additionalProperties: false
          required: [id, version, commit, updatedAt]
          properties:
            id: { type: string, minLength: 1 }
            version: { type: string, minLength: 1 }
            commit: { type: [string, 'null'] }
            updatedAt: { type: [string, 'null'], format: date-time }
        levels:
          type: array
          minItems: 10
          maxItems: 10
          items: { $ref: '#/components/schemas/Level' }
    ResultReport:
      type: object
      additionalProperties: false
      required: [checks, durationMs]
      properties:
        checks:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/Check' }
        durationMs: { type: integer, minimum: 0 }
        metrics:
          description: optional; null zählt wie „nicht angegeben“ (ergibt {})
          type: [object, 'null']
    HistoryEntry:
      type: object
      additionalProperties: false
      required: [id, status, checkedAt, durationMs, checks, metrics]
      properties:
        id: { type: integer, minimum: 1 }
        status: { enum: [bestanden, fehlgeschlagen] }
        checkedAt: { type: string, format: date-time }
        durationMs: { type: integer, minimum: 0 }
        checks:
          type: array
          items: { $ref: '#/components/schemas/Check' }
        metrics: { type: object }
    History:
      type: object
      additionalProperties: false
      required: [level, entries]
      properties:
        level: { type: integer, minimum: 1, maximum: 10 }
        entries:
          type: array
          items: { $ref: '#/components/schemas/HistoryEntry' }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, minLength: 1 }
  responses:
    BadRequest:
      description: Ungültiges JSON, fehlende/falsche/unbekannte Felder
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Unbekanntes Level oder unbekannter Pfad
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    MethodNotAllowed:
      description: Falsche Methode; Header Allow nennt die erlaubte Methode
      headers:
        Allow: { schema: { type: string } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Ein niedrigeres Level ist nicht bestanden
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooLarge:
      description: Body größer als 64 KB
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnsupportedMediaType:
      description: Content-Type ist nicht application/json
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
