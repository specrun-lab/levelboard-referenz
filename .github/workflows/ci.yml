# Levelboard – Pipeline (Level 6): baut und prüft die Levels 1–5 im Specrun-Container.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/specrun-lab/devcontainer:1
      # Container-Jobs brauchen root (Schreibrechte im Arbeitsordner des Runners)
      options: --user root
    env:
      # Go-Module und Build-Cache aus dem Image nutzen (als root zeigt HOME woanders hin)
      GOMODCACHE: /home/dev/go/pkg/mod
      GOCACHE: /home/dev/.cache/go-build
      # -buildvcs=false: Git verweigert im Container (root ≠ Eigentümer des Arbeitsordners) die Abfrage,
      # die go build für die Versionsangabe macht („error obtaining VCS status“)
      GOFLAGS: -modcacherw -buildvcs=false
    steps:
      - uses: actions/checkout@v7

      - name: Levels 1–5 starten
        run: make level5

      - name: Prüfsuite
        run: make check

      - name: Report hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: levelboard-report
          path: |
            frontend/dist/results.json
            checks/.out/playwright.json

  images:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # ghcr.io/specrun-lab/levelboard-<RUN_ID> → …-frontend und …-backend
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0

      - name: Images bauen
        run: docker compose build

      - name: Container starten
        run: docker compose up -d --wait

      - name: Container-Suite
        working-directory: checks
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/container.spec.ts

      - name: Report hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: levelboard-container-report
          path: checks/.out/playwright.json

      - name: Images in die GHCR pushen
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose push
          for part in frontend backend; do
            docker tag "$IMAGE_PREFIX-$part:$IMAGE_TAG" "$IMAGE_PREFIX-$part:main"
            docker push "$IMAGE_PREFIX-$part:main"
          done

      - name: Container stoppen
        if: always()
        run: docker compose down -v
